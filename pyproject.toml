[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-adapter"
version = "0.1.0"
description = "Local asynchronous Discord REST and event gateway"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.6,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
voice = ["discord.py[voice]>=2.6,<3", "discord-ext-voice-recv>=0.5.2a179,<0.6"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-mock>=3.14,<4", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
discord-adapter = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
